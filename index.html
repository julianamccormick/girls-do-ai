<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giraffe</title>
  <style>
    body {
      margin: 0;
      background: #87CEEB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 100vh;
      font-family: sans-serif;
    }

    h1 {
      position: fixed;
      top: 20px;
      font-size: 2.5rem;
      color: #fff;
      text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
      margin: 0;
    }

    /* Ground */
    .ground {
      width: 100%;
      height: 120px;
      background: #5a8a3c;
      border-radius: 50% 50% 0 0 / 20px 20px 0 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* Sun */
    .sun {
      position: fixed;
      top: 40px;
      right: 80px;
      width: 70px;
      height: 70px;
      background: #FFD700;
      border-radius: 50%;
      box-shadow: 0 0 40px 10px rgba(255, 215, 0, 0.5);
    }

    /* Clouds */
    .cloud {
      position: fixed;
      background: #fff;
      border-radius: 50px;
      opacity: 0.85;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }
    .cloud-1 { width: 120px; height: 40px; top: 80px; left: 100px; }
    .cloud-1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
    .cloud-1::after  { width: 40px; height: 40px; top: -20px; left: 60px; }

    .cloud-2 { width: 90px; height: 30px; top: 140px; left: 380px; }
    .cloud-2::before { width: 45px; height: 45px; top: -22px; left: 10px; }
    .cloud-2::after  { width: 30px; height: 30px; top: -14px; left: 45px; }
  </style>
</head>
<body>

  <h1>Hello, Giraffe!</h1>

  <div class="sun"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>

  <!-- Giraffe SVG illustration -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 300 520"
    width="300"
    height="520"
    style="margin-bottom: -10px;"
    aria-label="A friendly giraffe"
  >
    <!-- ===== LEGS ===== -->
    <!-- Front left leg -->
    <rect x="95" y="330" width="32" height="130" rx="10" fill="#E8A020"/>
    <!-- Front right leg -->
    <rect x="140" y="330" width="32" height="130" rx="10" fill="#C87818"/>
    <!-- Back left leg -->
    <rect x="180" y="330" width="32" height="130" rx="10" fill="#E8A020"/>
    <!-- Back right leg -->
    <rect x="220" y="330" width="32" height="130" rx="10" fill="#C87818"/>

    <!-- Hooves -->
    <rect x="95"  y="445" width="32" height="18" rx="6" fill="#4a3010"/>
    <rect x="140" y="445" width="32" height="18" rx="6" fill="#3a2008"/>
    <rect x="180" y="445" width="32" height="18" rx="6" fill="#4a3010"/>
    <rect x="220" y="445" width="32" height="18" rx="6" fill="#3a2008"/>

    <!-- ===== BODY ===== -->
    <ellipse cx="175" cy="295" rx="90" ry="70" fill="#E8A020"/>

    <!-- Body spots -->
    <ellipse cx="145" cy="270" rx="22" ry="16" fill="#b06010"/>
    <ellipse cx="200" cy="260" rx="18" ry="13" fill="#b06010"/>
    <ellipse cx="215" cy="305" rx="20" ry="14" fill="#b06010"/>
    <ellipse cx="155" cy="315" rx="15" ry="11" fill="#b06010"/>
    <ellipse cx="130" cy="305" rx="12" ry="9"  fill="#b06010"/>

    <!-- ===== NECK ===== -->
    <polygon points="145,140 185,140 200,280 130,280" fill="#E8A020"/>

    <!-- Neck spots -->
    <ellipse cx="158" cy="185" rx="14" ry="18" fill="#b06010"/>
    <ellipse cx="175" cy="230" rx="12" ry="14" fill="#b06010"/>
    <ellipse cx="185" cy="175" rx="10" ry="13" fill="#b06010"/>

    <!-- ===== HEAD ===== -->
    <ellipse cx="165" cy="115" rx="48" ry="38" fill="#E8A020"/>

    <!-- Snout -->
    <ellipse cx="205" cy="128" rx="22" ry="16" fill="#d08818"/>

    <!-- Nostril -->
    <ellipse cx="200" cy="131" rx="4" ry="3" fill="#a06010"/>
    <ellipse cx="212" cy="131" rx="4" ry="3" fill="#a06010"/>

    <!-- Eye -->
    <circle cx="183" cy="105" r="10" fill="#fff"/>
    <circle cx="185" cy="106" r="6"  fill="#3a2000"/>
    <circle cx="187" cy="104" r="2"  fill="#fff"/>

    <!-- Eyelashes -->
    <line x1="178" y1="96" x2="175" y2="90" stroke="#3a2000" stroke-width="2" stroke-linecap="round"/>
    <line x1="183" y1="94" x2="182" y2="88" stroke="#3a2000" stroke-width="2" stroke-linecap="round"/>
    <line x1="188" y1="95" x2="189" y2="89" stroke="#3a2000" stroke-width="2" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M 196 138 Q 208 148 218 138" stroke="#a06010" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- ===== OSSICONES (horns) ===== -->
    <rect x="147" y="75"  width="10" height="32" rx="5" fill="#C87818"/>
    <rect x="168" y="68"  width="10" height="32" rx="5" fill="#C87818"/>
    <!-- Horn tips -->
    <circle cx="152" cy="74"  r="7" fill="#d08818"/>
    <circle cx="173" cy="67"  r="7" fill="#d08818"/>

    <!-- ===== MANE ===== -->
    <path d="M 150 78 Q 148 160 143 280" stroke="#b06010" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ===== TAIL ===== -->
    <path d="M 263 268 Q 285 310 272 348 Q 264 365 270 380" stroke="#C87818" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Tail tuft -->
    <ellipse cx="272" cy="385" rx="8" ry="14" fill="#7a4a10" transform="rotate(-10,272,385)"/>
  </svg>

  <div class="ground"></div>

</body>
</html>
